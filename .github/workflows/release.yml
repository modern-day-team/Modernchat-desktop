# 正式发布工作流：推送 v* tag 或手动触发。
# Windows 使用 EV/OV 代码签名证书（PFX），macOS 使用 Developer ID 证书并公证。
# 任何签名 secret 缺失时对应任务失败，不发布 unsigned 包。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows signed MSI/NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 校验签名 Secrets
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          foreach ($k in @('WINDOWS_CERTIFICATE_BASE64','WINDOWS_CERTIFICATE_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($k)) { throw "缺少 secret: $k" }
          }

      - name: 导入代码签名证书
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\signing.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null

      - name: 写入临时签名配置
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\signing.pfx".Replace('\','/')
          @"
          {
            "bundle": {
              "windows": {
                "certificatePath": "$certPath",
                "timestampUrl": "http://timestamp.digicert.com"
              }
            }
          }
          "@ | Set-Content -Encoding UTF8 src-tauri/tauri.signing.json

      - run: npm ci --no-audit --no-fund
      - name: 构建签名安装包
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.signing.json

      - uses: actions/upload-artifact@v4
        with:
          name: modernchat-desktop-windows-signed
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS signed and notarized DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 校验签名 Secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for k in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID MACOS_SIGNING_IDENTITY; do
            if [ -z "${!k}" ]; then echo "缺少 secret: $k"; exit 1; fi
          done

      - name: 导入 Developer ID 证书
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          printf '%s' "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 写入临时签名配置
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          python3 - "$MACOS_SIGNING_IDENTITY" <<'PY'
          import json, sys
          cfg = {
            "bundle": {
              "macOS": {
                "signingIdentity": sys.argv[1],
                "hardenedRuntime": True,
              }
            }
          }
          with open('src-tauri/tauri.signing.json', 'w', encoding='utf-8') as f:
            json.dump(cfg, f, ensure_ascii=False, indent=2)
          PY

      - run: npm ci --no-audit --no-fund
      - name: 构建签名并公证的 DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --config src-tauri/tauri.signing.json

      - uses: actions/upload-artifact@v4
        with:
          name: modernchat-desktop-macos-signed
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布附件
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          find artifacts -type f -maxdepth 3 -print
          gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes artifacts/*/* \
            || gh release upload "$TAG_NAME" --clobber artifacts/*/*
